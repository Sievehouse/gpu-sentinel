# Capacity Ledger agent: one pod per GPU node, read-only towards the host.
#
# By default it tails /var/log/kern.log (Ubuntu/Debian with rsyslog), which
# needs no privileges beyond membership of the "adm" group (gid 4). For hosts
# without that file, see the /dev/kmsg alternative at the bottom.
#
# Keys: every agent creates its own Ed25519 key in /var/lib/capledger/keys on
# its node the first time it starts, and announces the public key in its
# evidence log. No key is shared between nodes and no Kubernetes secret is
# needed. After checking the announcements, enrol the keys once:
#   capledger keyring import --keyring keyring.json \
#     --log evidence-gpu-001.jsonl --log evidence-gpu-002.jsonl ... \
#     --owner "Example Neocloud" --role provider-agent
# Each key is then trusted only for the node it announced (docs/keys-and-keyring.md).
# Keep /var/lib/capledger across reboots; a re-imaged node gets a new key that
# must be enrolled again.
#
# Heartbeats: the agent writes one per minute, so stretches without evidence
# show up as unmonitored time (docs/sla-spec.md).
apiVersion: v1
kind: Namespace
metadata:
  name: capledger
---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: capledger-agent
  namespace: capledger
  labels:
    app.kubernetes.io/name: capledger-agent
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: capledger-agent
  template:
    metadata:
      labels:
        app.kubernetes.io/name: capledger-agent
    spec:
      nodeSelector:
        nvidia.com/gpu.present: "true"   # set by NVIDIA GPU feature discovery; use your AMD GPU operator's label for AMD nodes
      tolerations:
        - operator: Exists
      priorityClassName: system-node-critical
      automountServiceAccountToken: false  # the agent never talks to the Kubernetes API
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        supplementalGroups: [4]          # "adm": read access to /var/log/kern.log
        seccompProfile:
          type: RuntimeDefault
      initContainers:
        # kubelet creates the hostPath directory owned by root; hand it to the
        # agent's user once, and keep the key directory private.
        - name: prepare-state-dir
          image: busybox:1.36.1
          command: ["sh", "-c", "mkdir -p /var/lib/capledger/keys && chown 65532:65532 /var/lib/capledger /var/lib/capledger/keys && chmod 0700 /var/lib/capledger/keys"]
          securityContext:
            runAsUser: 0
            runAsNonRoot: false
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
              add: ["CHOWN", "FOWNER"]
          volumeMounts:
            - { name: state, mountPath: /var/lib/capledger }
      containers:
        - name: agent
          image: ghcr.io/sievehouse/capacity-ledger-agent:0.2.0   # build with deploy/docker/Dockerfile.agent
          args:
            - agent
            - --node=$(NODE_NAME)
            - --source=/host/var/log/kern.log
            - --log=/var/lib/capledger/evidence-$(NODE_NAME).jsonl
            - --key-dir=/var/lib/capledger/keys
            - --heartbeat=60s
            # - --expected-gpus=8      # also count GPUs; NVIDIA needs the NVIDIA container runtime
            # AMD nodes: count GPUs and read RAS error counters from the host's sysfs
            #   (also add the host-sys mount and volume below):
            # - --vendor=amd
            # - --sys-root=/host/sys
          env:
            - name: NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            requests: { cpu: 10m, memory: 32Mi }
            limits: { cpu: 100m, memory: 64Mi }
          volumeMounts:
            - { name: host-log, mountPath: /host/var/log, readOnly: true }
            - { name: state, mountPath: /var/lib/capledger }
            # - { name: host-sys, mountPath: /host/sys, readOnly: true }   # AMD
      volumes:
        - name: host-log
          hostPath: { path: /var/log, type: Directory }
        - name: state
          hostPath: { path: /var/lib/capledger, type: DirectoryOrCreate }
        # - name: host-sys                                                # AMD
        #   hostPath: { path: /sys, type: Directory }
# Alternative for hosts without /var/log/kern.log: read /dev/kmsg directly.
# Container runtimes block host devices for unprivileged containers, so this
# needs `privileged: true` (as node-problem-detector does). Replace the
# host-log mount with:
#   - { name: kmsg, mountPath: /dev/kmsg, readOnly: true }
#   volumes: - { name: kmsg, hostPath: { path: /dev/kmsg, type: CharDevice } }
# and pass --source=kmsg.
